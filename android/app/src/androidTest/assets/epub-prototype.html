<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline EPUB prototype</title>
  <style>html,body,#viewer { width: 100%; height: 100%; margin: 0; }</style>
  <script src="/jszip.min.js"></script>
  <script src="/epub.min.js"></script>
</head>
<body>
  <div id="viewer"></div>
  <script>
    window.prototypeResult = {state: 'opening'};
    (async () => {
      const response = await fetch('/fixture.epub');
      if (!response.ok) throw new Error('Fixture could not be loaded');
      window.prototypeResult = {state: 'reading-archive'};
      const book = ePub(await response.arrayBuffer());
      await book.ready;
      window.prototypeResult = {state: 'rendering'};
      const rendition = book.renderTo('viewer', {
        width: '100%', height: '100%', flow: 'paginated', allowScriptedContent: false
      });
      const restoredCfi = __RESTORED_CFI__;
      const targetHref = __TARGET_HREF__;
      const marker = __MARKER__;
      const navigation = await book.loaded.navigation;
      if (restoredCfi) {
        await rendition.display(restoredCfi);
      } else {
        await rendition.display();
        await rendition.display(targetHref);
      }
      const location = await rendition.currentLocation();
      const contents = rendition.getContents();
      const text = contents.map(content => content.document.body.textContent).join(' ');
      const image = contents[0].document.querySelector('img');
      if (image && !image.complete) await new Promise(resolve => { image.onload = resolve; image.onerror = resolve; });
      window.prototypeResult = {
        tocCount: navigation.toc.length, imageLoaded: !!(image && image.complete && image.naturalWidth > 0),
        state: 'ready', cfi: (location && location.start && location.start.cfi) || '',
        href: (location && location.start && location.start.href) || '',
        markerPresent: text.includes(marker)
      };
    })().catch(error => {
      window.prototypeResult = {state: 'error', message: String((error && error.message) || error)};
    });
  </script>
</body>
</html>
