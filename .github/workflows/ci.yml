name: Reconstruction checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Package browser runtime for the initial refactor verification
        if: github.ref == 'refs/heads/refactor/reader-foundation' && contains(github.event.head_commit.message, 'bootstrap-browser')
        run: tar -C "$HOME/.cache/ms-playwright" -czf "$RUNNER_TEMP/reader-browser-runtime.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/refactor/reader-foundation' && contains(github.event.head_commit.message, 'bootstrap-browser')
        with:
          name: reader-browser-runtime
          path: ${{ runner.temp }}/reader-browser-runtime.tar.gz
          retention-days: 1
          compression-level: 0
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
