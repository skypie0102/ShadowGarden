name: ShadowGarden checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Full regression backstop for changes eligible for focused presentation checks.
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
concurrency:
  # Replace stale PR checks; main releases keep running through publication.
  group: shadowgarden-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      pattern: ${{ steps.plan.outputs.pattern }}
      profile: ${{ steps.plan.outputs.profile }}
      deploy: ${{ steps.plan.outputs.deploy }}
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Select checks from the complete change set
        id: plan
        run: node scripts/plan-ci.mjs
      - run: npm ci
        if: steps.plan.outputs.mode != 'docs'
      - run: npm run check
        if: steps.plan.outputs.mode != 'docs'

  production-access:
    name: Check production access
    needs: verify
    if: needs.verify.outputs.deploy == 'true' && github.repository == 'skypie0102/ShadowGarden' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Read-only checks identify the rejected resource without logging secrets,
      # project settings or catalog documents. Full release guards still run.
      - name: Check Pages and D1 credential access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token || /\s/.test(token)) {
            throw new Error('Set a valid CLOUDFLARE_API_TOKEN repository Actions secret.');
          }
          const account = 'fa95f62f96a0ff3b92a45175d94a48b6';
          const resources = [
            { label: 'Pages project read', path: `/accounts/${account}/pages/projects/shadowgarden`, method: 'GET' },
            { label: 'D1 catalog SELECT', path: `/accounts/${account}/d1/database/1a9d28bf-fe1b-46d5-afbf-47ae9e0ffb86/query`, method: 'POST', body: { sql: 'SELECT revision FROM library_state WHERE id=1;' } }
          ];
          let failed = false;
          for (const resource of resources) {
            try {
              const response = await fetch('https://api.cloudflare.com/client/v4' + resource.path, {
                method: resource.method,
                redirect: 'manual',
                signal: AbortSignal.timeout(20000),
                headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
                ...(resource.body ? { body: JSON.stringify(resource.body) } : {})
              });
              const payload = await response.json();
              if (response.status !== 200 || payload.success !== true) {
                const details = (payload.errors || []).map(error =>
                  String(error.code) + ': ' + String(error.message || '')
                    .split(token).join('[redacted]').replace(/[\r\n]/g, ' ').slice(0, 200)
                ).join('; ');
                console.error(`${resource.label}: HTTP ${response.status}; ${details || 'unsuccessful API response'}`);
                failed = true;
              } else if (resource.body && (!Array.isArray(payload.result) ||
                  payload.result.some(result => result.success !== true || result.meta?.rows_written !== 0))) {
                console.error(`${resource.label}: read-only query validation failed`);
                failed = true;
              } else {
                console.log(`${resource.label}: OK`);
              }
            } catch {
              console.error(`${resource.label}: request failed without a valid API response`);
              failed = true;
            }
          }
          if (failed) process.exitCode = 1;
          NODE

  browser:
    needs: verify
    if: needs.verify.outputs.mode != 'docs'
    name: browser (${{ matrix.project }}, ${{ matrix.engine }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Keep the image version/digest aligned with the pinned @playwright/test.
    # Browsers and OS dependencies are preinstalled; no per-job apt downloads.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --init --ipc=host
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI_BROWSER_PATTERN: ${{ needs.verify.outputs.pattern }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify pinned browser runtime
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, accessSync, constants } from 'node:fs';
          import { chromium, firefox, webkit } from '@playwright/test';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (lock.packages['node_modules/@playwright/test'].version !== '1.63.0') {
            throw new Error('Update the pinned Playwright CI image with the package version.');
          }
          for (const [name, browser] of Object.entries({ chromium, firefox, webkit })) {
            accessSync(browser.executablePath(), constants.X_OK);
            console.log(`${name}: preinstalled executable available`);
          }
          NODE
      # Optional public runtime export permits reproducing a CI failure when the
      # local network cannot reach Playwright's CDN. No app data is included.
      - name: Archive browser runtime for reproduction
        if: github.event_name == 'push' && matrix.shard == 1 && startsWith(matrix.project, 'desktop-') && contains(github.event.head_commit.message, '[export-browser-runtime]')
        run: tar -czf "$RUNNER_TEMP/browser-runtime.tar.gz" -C / ms-playwright
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && matrix.shard == 1 && startsWith(matrix.project, 'desktop-') && contains(github.event.head_commit.message, '[export-browser-runtime]')
        with:
          name: browser-runtime-${{ matrix.engine }}
          path: ${{ runner.temp }}/browser-runtime.tar.gz
          retention-days: 1
      # Build/start one isolated app per shard; each selected test runs once.
      - run: npm run build
      - name: Run selected browser tests
        run: npx playwright test "$CI_BROWSER_PATTERN" --project ${{ matrix.project }} --shard ${{ matrix.shard }}/${{ matrix.shards }} --max-failures=1
      - name: Profile Library module startup
        if: ${{ success() && needs.verify.outputs.profile == 'true' && matrix.project == 'desktop-chromium' && matrix.shard == 1 && github.event_name == 'pull_request' }}
        env:
          SG_STARTUP_BASELINE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$SG_STARTUP_BASELINE_REF"
          npm run profile:library
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            library-startup-results/
          retention-days: 7

  checks:
    name: CI checks
    needs: [verify, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      VERIFY_RESULT: ${{ needs.verify.result }}
      BROWSER_RESULT: ${{ needs.browser.result }}
      CHECK_MODE: ${{ needs.verify.outputs.mode }}
    steps:
      - name: Require every selected check to pass
        run: |
          test "$VERIFY_RESULT" = success
          if [ "$CHECK_MODE" = docs ]; then
            test "$BROWSER_RESULT" = skipped
          else
            test "$BROWSER_RESULT" = success
          fi

  production:
    name: Deploy live ShadowGarden
    needs: [verify, checks, production-access]
    if: needs.verify.outputs.deploy == 'true' && github.repository == 'skypie0102/ShadowGarden' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: shadowgarden-production
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
      CF_PAGES_BRANCH: main
      CF_PAGES_COMMIT_SHA: ${{ github.sha }}
      CLOUDFLARE_ACCOUNT_ID: fa95f62f96a0ff3b92a45175d94a48b6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip superseded application source
        id: source
        shell: bash
        run: |
          git fetch --no-tags origin main
          if git diff --quiet HEAD origin/main -- . ':(exclude)docs/**' ':(exclude)README.md'; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer application commit is on main; its checked run will deploy.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.source.outputs.deploy == 'true'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: steps.source.outputs.deploy == 'true'
      - run: npm run build && npm run check:functions
        if: steps.source.outputs.deploy == 'true'
      - name: Publish and verify existing live project
        if: steps.source.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy-production.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.source.outputs.deploy == 'true' }}
        with:
          name: production-verification
          path: .wrangler/production-verification.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
