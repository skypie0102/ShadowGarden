name: ShadowGarden checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            engine: chromium
          - project: mobile-chromium
            engine: chromium
          - project: desktop-firefox
            engine: firefox
          - project: desktop-webkit
            engine: webkit
          - project: mobile-webkit
            engine: webkit
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      # Optional public runtime export permits reproducing a CI failure when the
      # local network cannot reach Playwright's CDN. No app data is included.
      - name: Archive browser runtime for reproduction
        if: github.event_name == 'push' && startsWith(matrix.project, 'desktop-') && contains(github.event.head_commit.message, '[export-browser-runtime]')
        run: tar -czf "$RUNNER_TEMP/browser-runtime.tar.gz" -C "$HOME/.cache" ms-playwright
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(matrix.project, 'desktop-') && contains(github.event.head_commit.message, '[export-browser-runtime]')
        with:
          name: browser-runtime-${{ matrix.engine }}
          path: ${{ runner.temp }}/browser-runtime.tar.gz
          retention-days: 1
      - run: npm run test:browser -- --project ${{ matrix.project }} --max-failures=1
      - name: Profile Library module startup
        if: ${{ !cancelled() && matrix.project == 'desktop-chromium' && github.event_name == 'pull_request' }}
        env:
          SG_STARTUP_BASELINE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$SG_STARTUP_BASELINE_REF"
          npm run profile:library
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
            library-startup-results/
          retention-days: 7

  production:
    name: Deploy live ShadowGarden
    needs: [verify, browser]
    if: github.repository == 'skypie0102/ShadowGarden' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: shadowgarden-production
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
      CF_PAGES_BRANCH: main
      CF_PAGES_COMMIT_SHA: ${{ github.sha }}
      CLOUDFLARE_ACCOUNT_ID: fa95f62f96a0ff3b92a45175d94a48b6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip superseded application source
        id: source
        shell: bash
        run: |
          git fetch --no-tags origin main
          if git diff --quiet HEAD origin/main -- . ':(exclude)docs/**' ':(exclude)README.md'; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer application commit is on main; its checked run will deploy.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.source.outputs.deploy == 'true'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: steps.source.outputs.deploy == 'true'
      - run: npm run build && npm run check:functions
        if: steps.source.outputs.deploy == 'true'
      - name: Publish and verify existing live project
        if: steps.source.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy-production.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.source.outputs.deploy == 'true' }}
        with:
          name: production-verification
          path: .wrangler/production-verification.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
