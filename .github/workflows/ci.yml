name: Reader verification browser runtime
on:
  push:
    branches: [tooling/reader-chromium-runtime-2.26.1]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --init --ipc=host
    steps:
      - name: Archive only the pinned Chromium headless runtime
        run: |
          cd /
          tar -czf "$RUNNER_TEMP/reader-chromium-headless.tar.gz" ms-playwright/chromium_headless_shell-*
          sha256sum "$RUNNER_TEMP/reader-chromium-headless.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: reader-chromium-headless-1.63.0
          path: ${{ runner.temp }}/reader-chromium-headless.tar.gz
          retention-days: 1
