name: Android checks
on:
  push:
    branches: [main]
    paths: ['android/**', 'server/**', 'functions/**', 'docs/guides/API_CONTRACTS.md', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'server/**', 'functions/**', 'docs/guides/API_CONTRACTS.md', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and check Android app
        run: ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest
